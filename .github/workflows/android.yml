name: Android APK

# Builds the Android app from index.html every time main changes (or by hand from the Actions tab).
# On main it also updates the "Latest Android app" release so the APK is always at the same link.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - name: Copy app files into the Android project
        run: npm run sync

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk BillTracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BillTracker-apk
          path: BillTracker.apk

      - name: Publish to the "Latest Android app" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Built from $(git rev-parse --short HEAD) on $(date -u +'%Y-%m-%d'). On your Android phone, download BillTracker.apk below and open it to install or update."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest BillTracker.apk --clobber
            gh release edit android-latest --notes "$NOTES"
          else
            gh release create android-latest BillTracker.apk --title "Latest Android app" --notes "$NOTES" --latest
          fi
